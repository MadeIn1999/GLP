<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Técnica - Editar Registro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .contenedor-editar { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-top: 4px solid #2c5aa0; }
        h3 { color: #2c5aa0; margin-bottom: 20px; font-size: 16px; }
        label { font-weight: bold; font-size: 11px; color: #555; display: block; margin-top: 12px; }
        .input-editar { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; outline: none; }
        .input-editar:focus { border: 2px solid #2c5aa0; }
        .botones-grupo { margin-top: 20px; display: flex; align-items: center; gap: 15px; }
        .btn-guardar { background-color: #2c5aa0; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-guardar:hover { background-color: #1e3d6b; }
        .btn-cancelar { color: #666; text-decoration: none; font-size: 12px; }
        .btn-cancelar:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="contenedor-editar">
        <h3>Modificar Datos del Expediente</h3>
        <form action="/editar/{{ legajo.id }}" method="POST">
            
            <label>NÚMERO DE LEGAJO (GAS AUSTRAL):</label>
            <input type="text" name="nro_legajo" class="input-editar" value="{{ legajo.nro_legajo }}" required>

            <label>NOMBRE DE LA OBRA / INSTALACIÓN:</label>
            <input type="text" name="nombre" class="input-editar" value="{{ legajo.nombre }}" required>

            <label>REVISOR TÉCNICO ASIGNADO:</label>
            <input type="text" name="revisor" class="input-editar" value="{{ legajo.revisor_asignado or '' }}" required>

            <div class="botones-grupo">
                <button type="submit" class="btn-guardar">Guardar Cambios</button>
                <a href="/" class="btn-cancelar">Cancelar y volver</a>
            </div>
        </form>
    </div>
</body>
</html>
